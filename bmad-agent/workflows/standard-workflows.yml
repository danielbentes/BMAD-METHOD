workflow_tracking:
  enabled: true
  state_file: ".bmad/state/workflow-state.md"
  analytics_enabled: true
  tracking_metadata:
    capture_timestamps: true
    track_blockers: true
    measure_phase_duration: true
    compare_to_typical: true
    memory_integration: true
  analytics_config:
    bottleneck_threshold: "150% of typical duration"
    efficiency_metrics:
      - phase_completion_time
      - handoff_efficiency
      - rework_frequency
      - blocker_resolution_time
    reporting:
      frequency: "per_phase"
      format: "markdown"
      location: ".bmad/analytics/workflow-reports/"

workflows:
  new-project:
    name: "New Project - Full BMAD Flow"
    description: "Complete flow from concept to implementation for new projects"
    project_types: ["mvp", "prototype", "greenfield"]
    estimated_duration: "2-4 weeks"
    quality_gates:
      enabled: true
      automatic_triggers: true
      enforcement_level: "strict"
    phases:
      - phase: "Discovery"
        personas: ["Analyst"]
        tasks: 
          - "Brainstorming"
          - "Deep Research Prompt Generation" 
          - "Create Project Brief"
        artifacts: 
          - ".bmad/current/specs/project-brief.md"
        completion_criteria: 
          - "Project brief approved by user"
          - "Target users clearly defined"
          - "Core problem statement validated"
        memory_tags: ["discovery", "research", "problem-definition"]
        typical_duration: "2-5 days"
        success_indicators:
          - "Clear problem-solution fit"
          - "Well-defined user personas"
          - "Realistic scope boundaries"
        quality_gates:
          phase_entry:
            checks:
              - name: "context_loaded"
                required: true
                description: "Previous context restored if available"
              - name: "memory_ready"
                required: true
                description: "Memory system initialized"
          phase_exit:
            checks:
              - name: "problem_validation"
                threshold: 90
                description: "Problem clearly defined with evidence"
              - name: "user_research"
                threshold: 85
                description: "Target users researched and documented"
              - name: "scope_definition"
                threshold: 95
                description: "Scope boundaries clearly established"
        
      - phase: "Requirements"
        personas: ["PM", "Design Architect"]
        tasks: 
          - "Create PRD"
          - "Create UX/UI Spec"
        artifacts: 
          - ".bmad/current/specs/prd.md"
          - ".bmad/current/specs/frontend-spec.md"
        completion_criteria: 
          - "PRD validated by PM checklist"
          - "UI flows defined and approved"
          - "Technical assumptions documented"
        memory_tags: ["requirements", "prd", "ux-specification"]
        typical_duration: "3-7 days"
        success_indicators:
          - "Clear epic and story structure"
          - "Comprehensive acceptance criteria"
          - "UI/UX wireframes complete"
        dependencies:
          - "Discovery phase artifacts exist"
        quality_gates:
          phase_entry:
            checks:
              - name: "discovery_complete"
                required: true
                description: "Discovery phase gates passed"
              - name: "stakeholder_ready"
                required: true
                description: "Stakeholders available for review"
          phase_exit:
            checks:
              - name: "prd_completeness"
                threshold: 95
                description: "PRD complete with all sections"
              - name: "acceptance_criteria"
                threshold: 100
                description: "All stories have clear acceptance criteria"
              - name: "ui_specification"
                threshold: 90
                description: "UI flows and wireframes documented"
              - name: "technical_feasibility"
                threshold: 85
                description: "Technical assumptions validated"
        
      - phase: "Architecture"
        personas: ["Architect", "Design Architect"]
        tasks: 
          - "Create Architecture"
          - "Create Frontend Architecture"
        artifacts: 
          - ".bmad/current/specs/architecture.md"
          - ".bmad/current/specs/frontend-architecture.md"
        completion_criteria: 
          - "Tech stack decisions finalized"
          - "Component structure defined"
          - "Architecture validated by checklist"
        memory_tags: ["architecture", "tech-stack", "system-design"]
        typical_duration: "3-6 days"
        success_indicators:
          - "Scalable architecture design"
          - "Clear component boundaries"
          - "Performance considerations addressed"
        dependencies:
          - "PRD and UI specifications complete"
        quality_gates:
          phase_entry:
            checks:
              - name: "requirements_complete"
                required: true
                description: "Requirements phase gates passed"
              - name: "architecture_udtm_ready"
                required: true
                description: "Ready for Ultra-Deep Thinking Mode"
          phase_exit:
            checks:
              - name: "architecture_analysis"
                threshold: 100
                description: "Architecture analysis tag present and complete"
              - name: "scalability_design"
                threshold: 90
                description: "Scalability considerations documented"
              - name: "security_architecture"
                threshold: 95
                description: "Security patterns implemented"
              - name: "performance_planning"
                threshold: 85
                description: "Performance targets defined"
              - name: "component_boundaries"
                threshold: 95
                description: "Clear module separation"
          
      - phase: "Development Prep"
        personas: ["PO", "SM"]
        tasks: 
          - "PO Master Checklist"
          - "Doc Sharding"
          - "Create Next Story"
        artifacts: 
          - ".bmad/current/work/stories/active/1.1.story.md"
          - ".bmad/current/specs/index.md"
        completion_criteria: 
          - "All documents validated by PO"
          - "First story ready for development"
          - "Development environment guidelines clear"
        memory_tags: ["validation", "story-preparation", "development-setup"]
        typical_duration: "1-3 days"
        success_indicators:
          - "Document consistency verified"
          - "Clear development roadmap"
          - "First story well-specified"
        dependencies:
          - "Architecture documents complete"
        quality_gates:
          phase_entry:
            checks:
              - name: "architecture_approved"
                required: true
                description: "Architecture phase gates passed"
              - name: "po_available"
                required: true
                description: "Product Owner ready for validation"
          phase_exit:
            checks:
              - name: "document_validation"
                threshold: 100
                description: "All documents pass PO master checklist"
              - name: "story_quality"
                threshold: 95
                description: "Stories have clear DoD and acceptance criteria"
              - name: "development_ready"
                threshold: 90
                description: "Development guidelines documented"
          
      - phase: "Development"
        personas: ["SM", "Dev"]
        tasks: 
          - "Create Next Story"
          - "Story Implementation"
          - "Story DoD Checklist"
        artifacts: 
          - "src/**"
          - ".bmad/current/work/stories/**"
          - "tests/**"
        completion_criteria: 
          - "Stories complete with DoD validation"
          - "Tests passing"
          - "Code reviews completed"
        memory_tags: ["development", "implementation", "testing"]
        typical_duration: "ongoing"
        success_indicators:
          - "Consistent code quality"
          - "Reliable test coverage"
          - "Regular story completion"
        dependencies:
          - "Development prep phase complete"
        quality_gates:
          pre_commit:
            automatic_trigger: true
            checks:
              - name: "linting"
                threshold: 100
                description: "Zero linting violations"
              - name: "type_checking"
                threshold: 100
                description: "Zero type errors"
              - name: "unit_tests"
                threshold: 100
                description: "All unit tests passing"
              - name: "style_consistency"
                threshold: 95
                description: "Code matches project style patterns"
          story_completion:
            automatic_trigger: true
            checks:
              - name: "dod_checklist"
                threshold: 100
                description: "Definition of Done complete"
              - name: "test_coverage"
                threshold: 85
                description: "Minimum test coverage met"
              - name: "code_review"
                threshold: 100
                description: "Code review approved"
              - name: "integration_tests"
                threshold: 100
                description: "Integration tests passing"
          sprint_end:
            checks:
              - name: "sprint_goals"
                threshold: 90
                description: "Sprint goals achieved"
              - name: "technical_debt"
                threshold: 85
                description: "Technical debt within limits"
              - name: "performance_baseline"
                threshold: 95
                description: "Performance metrics maintained"

  feature-addition:
    name: "Add Feature to Existing Project"
    description: "Streamlined flow for adding features to established projects"
    project_types: ["existing", "enhancement", "expansion"]
    estimated_duration: "1-2 weeks"
    phases:
      - phase: "Feature Analysis"
        personas: ["PM", "Architect"]
        tasks: 
          - "Feature Impact Analysis"
          - "PRD Update"
          - "Architecture Review"
        artifacts:
          - ".bmad/current/specs/prd.md (updated)"
          - ".bmad/current/analysis/feature-analysis.md"
        completion_criteria:
          - "Feature requirements clearly defined"
          - "Technical feasibility confirmed"
          - "Impact on existing architecture assessed"
        memory_tags: ["feature-analysis", "impact-assessment", "enhancement"]
        typical_duration: "1-3 days"
        success_indicators:
          - "Minimal disruption to existing code"
          - "Clear integration points defined"
          - "User value clearly articulated"
          
      - phase: "Feature Architecture"
        personas: ["Architect", "Design Architect"]
        tasks:
          - "Component Design"
          - "Integration Planning"
          - "UI/UX Updates"
        artifacts:
          - ".bmad/current/specs/architecture.md (updated)"
          - ".bmad/current/specs/feature-components.md"
        completion_criteria:
          - "New components designed"
          - "Integration strategy defined"
          - "UI changes specified"
        memory_tags: ["component-design", "integration", "ui-updates"]
        typical_duration: "1-2 days"
        dependencies:
          - "Feature analysis complete"
          
      - phase: "Feature Development"
        personas: ["SM", "Dev"]
        tasks: 
          - "Story Creation"
          - "Feature Implementation"
          - "Integration Testing"
        artifacts:
          - ".bmad/current/work/stories/active/feature-*.md"
          - "src/features/**"
          - "tests/feature/**"
        completion_criteria:
          - "Feature stories implemented"
          - "Integration tests passing"
          - "Feature deployed and validated"
        memory_tags: ["feature-development", "integration-testing"]
        typical_duration: "3-8 days"
        dependencies:
          - "Feature architecture complete"

  course-correction:
    name: "Course Correction Flow"
    description: "Handle major changes, pivots, or critical issues"
    project_types: ["any"]
    estimated_duration: "varies"
    phases:
      - phase: "Change Assessment"
        personas: ["PO", "PM"]
        tasks: 
          - "Correct Course"
          - "Impact Analysis"
          - "Stakeholder Alignment"
        artifacts:
          - ".bmad/current/analysis/change-analysis.md"
          - ".bmad/current/analysis/impact-assessment.md"
        completion_criteria:
          - "Root cause identified"
          - "Change scope defined"
          - "Impact on timeline/resources assessed"
        memory_tags: ["course-correction", "change-management", "crisis-response"]
        typical_duration: "1-2 days"
        success_indicators:
          - "Clear problem identification"
          - "Realistic recovery plan"
          - "Stakeholder buy-in"
          
      - phase: "Re-planning"
        personas: ["PM", "Architect", "Design Architect"]
        tasks: 
          - "Update PRD"
          - "Update Architecture"
          - "Revise Timeline"
        artifacts:
          - ".bmad/current/specs/prd.md (revised)"
          - ".bmad/current/specs/architecture.md (revised)"
          - ".bmad/current/analysis/recovery-plan.md"
        completion_criteria:
          - "Updated plans approved"
          - "New timeline realistic"
          - "Technical approach validated"
        memory_tags: ["replanning", "architecture-revision", "timeline-adjustment"]
        typical_duration: "2-5 days"
        dependencies:
          - "Change assessment complete"
          
      - phase: "Recovery Implementation"
        personas: ["SM", "Dev", "PO"]
        tasks:
          - "Priority Reordering"
          - "Updated Story Creation"
          - "Recovery Development"
        artifacts:
          - ".bmad/current/work/stories/active/recovery-*.md"
          - "src/** (updated)"
        completion_criteria:
          - "Recovery plan executed"
          - "System stability restored"
          - "New development path established"
        memory_tags: ["recovery-implementation", "priority-adjustment"]
        typical_duration: "varies"
        dependencies:
          - "Re-planning phase complete"

  architecture-review:
    name: "Architecture Review & Optimization"
    description: "Review and optimize existing architecture for performance/scalability"
    project_types: ["existing", "optimization", "scaling"]
    estimated_duration: "1-2 weeks"
    phases:
      - phase: "Architecture Assessment"
        personas: ["Architect", "Dev"]
        tasks:
          - "Performance Analysis"
          - "Scalability Review"
          - "Technical Debt Assessment"
        artifacts:
          - ".bmad/current/analysis/architecture-review.md"
          - ".bmad/current/analysis/performance-analysis.md"
        completion_criteria:
          - "Current bottlenecks identified"
          - "Scalability limits documented"
          - "Technical debt prioritized"
        memory_tags: ["architecture-review", "performance", "technical-debt"]
        typical_duration: "2-4 days"
        
      - phase: "Optimization Planning"
        personas: ["Architect", "PM"]
        tasks:
          - "Optimization Strategy"
          - "Migration Planning"
          - "Risk Assessment"
        artifacts:
          - ".bmad/current/analysis/optimization-plan.md"
          - ".bmad/current/analysis/migration-strategy.md"
        completion_criteria:
          - "Optimization priorities set"
          - "Migration approach defined"
          - "Risks identified and mitigated"
        memory_tags: ["optimization-planning", "migration-strategy"]
        typical_duration: "1-3 days"
        dependencies:
          - "Architecture assessment complete"
          
      - phase: "Optimization Implementation"
        personas: ["Dev", "SM"]
        tasks:
          - "Performance Optimization"
          - "Architecture Updates"
          - "Validation Testing"
        artifacts:
          - "src/** (optimized)"
          - ".bmad/current/analysis/optimization-results.md"
        completion_criteria:
          - "Performance improvements validated"
          - "Architecture updates completed"
          - "System stability maintained"
        memory_tags: ["optimization-implementation", "performance-tuning"]
        typical_duration: "5-10 days"
        dependencies:
          - "Optimization planning complete"

  rapid-prototype:
    name: "Rapid Prototype Development"
    description: "Quick prototype for concept validation or demo"
    project_types: ["prototype", "poc", "demo"]
    estimated_duration: "3-7 days"
    phases:
      - phase: "Prototype Scoping"
        personas: ["PM", "Analyst"]
        tasks:
          - "Core Feature Definition"
          - "Prototype Goals"
          - "Success Criteria"
        artifacts:
          - ".bmad/current/specs/prototype-scope.md"
        completion_criteria:
          - "Core features defined"
          - "Success criteria clear"
          - "Time constraints acknowledged"
        memory_tags: ["prototype", "rapid-development", "poc"]
        typical_duration: "0.5-1 day"
        
      - phase: "Rapid Architecture"
        personas: ["Architect"]
        tasks:
          - "Minimal Viable Architecture"
          - "Technology Selection"
          - "Prototype Structure"
        artifacts:
          - ".bmad/current/specs/prototype-architecture.md"
        completion_criteria:
          - "Simple architecture defined"
          - "Technology stack selected"
          - "Development approach clear"
        memory_tags: ["minimal-architecture", "tech-selection"]
        typical_duration: "0.5-1 day"
        dependencies:
          - "Prototype scoping complete"
          
      - phase: "Prototype Development"
        personas: ["Dev"]
        tasks:
          - "Core Feature Implementation"
          - "Basic Testing"
          - "Demo Preparation"
        artifacts:
          - "src/**"
          - ".bmad/current/guidance/demo-guide.md"
        completion_criteria:
          - "Core features working"
          - "Demo ready"
          - "Basic validation complete"
        memory_tags: ["rapid-implementation", "demo-development"]
        typical_duration: "2-5 days"
        dependencies:
          - "Rapid architecture complete"

# Workflow Metadata
metadata:
  version: "1.0"
  last_updated: "2024-01-15"
  total_workflows: 5
  
# Memory Integration Settings
memory_integration:
  auto_track_progress: true
  learn_from_outcomes: true
  optimize_based_on_patterns: true
  
# Success Pattern Recognition
success_patterns:
  common_indicators:
    - "clear_requirements"
    - "stakeholder_alignment" 
    - "technical_feasibility"
    - "realistic_timelines"
    - "proper_validation"
  
  efficiency_factors:
    - "minimal_context_switching"
    - "parallel_workstreams"
    - "early_validation"
    - "proper_handoffs"
    
# Anti-Pattern Detection
anti_patterns:
  workflow_issues:
    - "skipping_validation_phases"
    - "premature_optimization"
    - "insufficient_requirements"
    - "architecture_without_prd"
    - "development_without_stories"
    
  process_problems:
    - "excessive_persona_switching"
    - "incomplete_handoffs"
    - "missing_documentation"
    - "scope_creep_without_replan"

# Quality Gate Automation Configuration
quality_gate_automation:
  automatic_triggers:
    enabled: true
    trigger_points:
      - "phase_completion"
      - "story_completion"
      - "pre_commit"
      - "pre_merge"
      - "milestone_reached"
      - "critical_change"
    
  enforcement_levels:
    strict:
      description: "Zero tolerance - all checks must pass"
      failure_action: "block_progress"
      override_allowed: false
    standard:
      description: "Standard enforcement - critical checks must pass"
      failure_action: "require_review"
      override_allowed: true
    advisory:
      description: "Advisory only - warnings provided"
      failure_action: "log_warning"
      override_allowed: true
  
  phase_specific_configs:
    discovery:
      enforcement: "standard"
      critical_checks: ["context_loaded", "memory_ready"]
      automated_checks: ["problem_validation"]
    requirements:
      enforcement: "strict"
      critical_checks: ["prd_completeness", "acceptance_criteria"]
      automated_checks: ["technical_feasibility"]
    architecture:
      enforcement: "strict"
      critical_checks: ["architecture_analysis", "security_architecture"]
      automated_checks: ["scalability_design", "performance_planning"]
    development:
      enforcement: "strict"
      critical_checks: ["linting", "type_checking", "unit_tests"]
      automated_checks: ["style_consistency", "test_coverage"]
  
  override_mechanism:
    requires_justification: true
    approval_levels:
      minor_override: "tech_lead"
      major_override: "architect"
      critical_override: "project_manager"
    documentation_required:
      - "business_justification"
      - "risk_assessment"
      - "remediation_timeline"
      - "accountability_assignment"
  
  improvement_guidance:
    automatic_suggestions: true
    sources:
      - "memory_patterns"
      - "best_practices"
      - "similar_projects"
      - "team_history"
    format: "actionable_steps"
    priority: "based_on_impact"
  
  metrics_tracking:
    gate_performance:
      - "pass_rate_by_phase"
      - "common_failure_reasons"
      - "time_to_resolution"
      - "override_frequency"
    quality_trends:
      - "improvement_over_time"
      - "regression_detection"
      - "team_performance"
      - "project_health"