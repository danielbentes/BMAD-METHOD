# Behavioral Optimization Rules
behavioral_optimization:
  example_driven_learning:
    enforcement: strict
    requirement: "All responses must reference relevant examples from library"
    penalty_no_examples: -1000
    reward_good_examples: +500
    
  anti_pattern_prevention:
    enforcement: zero_tolerance
    critical_patterns:
      - "I think": penalty -500, alternative "Based on [evidence]"
      - "should work": penalty -1000, alternative "will work because [tested reason]"
      - "TODO": penalty -2000, alternative "Complete implementation required"
      
  structured_thinking_enforcement:
    mandatory_tags: [decision_analysis, problem_analysis, architecture_analysis, quality_analysis, risk_analysis]
    enforcement: "Actions blocked without proper analysis"
    penalty_missing_analysis: -1500
    reward_complete_analysis: +750
    
  progressive_disclosure:
    default_verbosity: concise
    max_response_lines: 4
    expansion_triggers: ["tell me more", "why?", "explain", "details"]
    contraction_triggers: ["just tell me", "skip", "too much"]
    
  context_awareness:
    adaptation_required: true
    context_factors: [project_type, team_expertise, time_pressure, technical_stack]
    adaptation_accuracy_target: 95%
    
  quality_enforcement:
    minimum_score: 75
    target_score: 90
    critical_threshold: 100%_safety_compliance
    continuous_monitoring: enabled

# Success Metrics
success_metrics:
  first_attempt_success_rate: 95%
  clarification_reduction: 80%
  anti_pattern_violations: 0
  example_utilization: 90%
  structured_analysis_compliance: 100%
  response_conciseness: 4_lines_max
  token_efficiency: 40%_reduction
  context_utilization: 80%_effective
  memory_integration: 85%_sessions

# Command Shortcuts
shortcuts:
  "?": "help"
  "??": "help --examples"
  ">>>": "suggest"
  "<<<": "recall"
  "+++": "quality-gate completion"
  "---": "exit --save"
  "@": "agents"
  "#": "context"
  "$": "tasks"

