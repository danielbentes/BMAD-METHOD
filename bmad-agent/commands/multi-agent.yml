# Multi-Agent Configuration
# BMAD Method - AI Behavioral Optimization Framework

# Multi-Agent Orchestration Settings
orchestration:
  coordination_protocol: "behavioral_synthesis"
  quality_aggregation: "weighted_expertise"
  conflict_resolution: "evidence_based"
  synthesis_method: "structured_analysis"

# Agent Interaction Patterns
interaction_patterns:
  parallel_consultation:
    description: "Multiple personas analyze simultaneously then synthesize"
    behavioral_requirements:
      independent_analysis: required
      structured_output: mandatory
      evidence_backing: required
      synthesis_participation: collaborative
    
    process:
      1. "Individual Analysis Phase (3-5 minutes per agent)"
      2. "Structured Sharing Phase (each agent presents findings)"
      3. "Evidence Evaluation Phase (cross-validation of claims)"
      4. "Synthesis Phase (collaborative solution building)"
      5. "Decision Phase (consensus or documented dissent)"
    
    anti_patterns:
      - "Groupthink or early consensus"
      - "Unsupported claims in analysis"
      - "Vague language in recommendations"
      - "Scope creep beyond consultation topic"
    
    penalties:
      groupthink: -2000
      unsupported_claims: -1500
      vague_language: -1000
      scope_creep: -800
    
    success_metrics:
      diverse_perspectives: target_90_percent
      evidence_quality: target_85_percent
      synthesis_quality: target_90_percent

  sequential_handoff:
    description: "Personas work in sequence with structured handoffs"
    behavioral_requirements:
      context_preservation: mandatory
      quality_continuity: required
      clear_handoff_documentation: required
      next_steps_definition: explicit
    
    handoff_template: |
      HANDOFF: {from_persona} → {to_persona}
      
      COMPLETED WORK:
      {work_summary}
      
      CONTEXT FOR NEXT PHASE:
      {context_transfer}
      
      QUALITY VALIDATION:
      - Deliverable meets standards: ✓/✗
      - Evidence backing complete: ✓/✗
      - Anti-patterns avoided: ✓/✗
      
      NEXT ACTIONS:
      {next_steps}
    
    quality_gates:
      context_completeness: minimum_90_percent
      work_quality_score: minimum_85_percent
      documentation_clarity: minimum_90_percent
    
    penalties:
      incomplete_handoff: -1500
      quality_degradation: -2000
      context_loss: -1000

  brotherhood_review:
    description: "Honest peer review with constructive feedback"
    behavioral_requirements:
      honest_assessment: uncompromising
      constructive_feedback: required
      improvement_suggestions: specific
      quality_standards: zero_tolerance
    
    review_structure: |
      BROTHERHOOD REVIEW: {work_title}
      
      STRENGTHS:
      - {specific_strength_1}
      - {specific_strength_2}
      
      IMPROVEMENT AREAS:
      - {specific_issue_1}: {improvement_suggestion}
      - {specific_issue_2}: {improvement_suggestion}
      
      QUALITY ASSESSMENT:
      - Evidence backing: {score}/100
      - Structural clarity: {score}/100
      - Anti-pattern compliance: {score}/100
      
      VERDICT: {APPROVE|REVISE|REJECT}
      
      BROTHERHOOD HONESTY: {honest_assessment}
    
    quality_thresholds:
      evidence_backing: minimum_80
      structural_clarity: minimum_85
      anti_pattern_compliance: minimum_95
    
    review_standards:
      brutal_honesty: required
      specific_feedback: mandatory
      improvement_focus: constructive
      brotherhood_support: genuine

# Consultation Types
consultation_types:
  design_review:
    participants: [pm, architect, design_architect, quality_enforcer]
    focus: "Architecture, UX, and technical feasibility"
    duration: "15-20 minutes"
    deliverable: "Approved design with implementation plan"
    
    behavioral_coordination:
      pm_role: "Business requirements and constraints validation"
      architect_role: "Technical feasibility and scalability assessment"
      design_architect_role: "User experience and interface design"
      quality_enforcer_role: "Quality standards and anti-pattern prevention"
    
    success_criteria:
      design_completeness: minimum_90_percent
      technical_feasibility: confirmed
      ux_quality_score: minimum_85_percent
      implementation_clarity: minimum_90_percent

  technical_feasibility:
    participants: [architect, dev, sm, quality_enforcer]
    focus: "Implementation approach and technical decisions"
    duration: "10-15 minutes"
    deliverable: "Technical plan with risk assessment"
    
    behavioral_coordination:
      architect_role: "System design and technology choices"
      dev_role: "Implementation complexity and effort estimation"
      sm_role: "Sprint planning and delivery considerations"
      quality_enforcer_role: "Quality gates and standards enforcement"
    
    success_criteria:
      technical_clarity: minimum_90_percent
      implementation_plan: detailed
      risk_assessment: comprehensive
      quality_standards: enforced

  product_strategy:
    participants: [pm, po, analyst]
    focus: "Market positioning and product decisions"
    duration: "20-25 minutes"
    deliverable: "Product strategy with market validation"
    
    behavioral_coordination:
      pm_role: "Strategic vision and market analysis"
      po_role: "User story prioritization and acceptance criteria"
      analyst_role: "Research validation and data analysis"
    
    success_criteria:
      market_validation: evidence_based
      user_story_quality: minimum_90_percent
      strategic_alignment: confirmed
      data_backing: comprehensive

  quality_assessment:
    participants: [quality_enforcer, dev, architect]
    focus: "Code quality and system reliability"
    duration: "10-15 minutes"
    deliverable: "Quality report with improvement plan"
    
    behavioral_coordination:
      quality_enforcer_role: "Standards enforcement and gap identification"
      dev_role: "Implementation quality and technical debt assessment"
      architect_role: "Architectural integrity and scalability review"
    
    success_criteria:
      quality_score: minimum_85_percent
      improvement_plan: actionable
      technical_debt: documented
      standards_compliance: verified

# Conflict Resolution
conflict_resolution:
  evidence_based_resolution:
    process: |
      1. Each party presents evidence for their position
      2. Evidence quality assessment by neutral party
      3. Objective criteria evaluation
      4. Data-driven decision making
      5. Documented rationale for decision
    
    resolution_criteria:
      evidence_quality: weighted_50_percent
      alignment_with_goals: weighted_30_percent
      implementation_feasibility: weighted_20_percent
    
    anti_patterns:
      - "Authority-based decisions without evidence"
      - "Emotional arguments over data"
      - "Compromise without clear reasoning"
    
    penalties:
      authority_override: -3000
      emotional_arguments: -1500
      unclear_compromise: -1000

  expertise_weighted_resolution:
    process: |
      1. Domain expertise assessment for conflict area
      2. Weighted input based on relevant experience
      3. Senior expert final decision authority
      4. Clear documentation of decision rationale
    
    expertise_domains:
      technical_architecture: architect_primary
      user_experience: design_architect_primary
      business_strategy: pm_primary
      quality_standards: quality_enforcer_primary
      delivery_process: sm_primary
    
    weighting_algorithm: |
      decision_weight = (domain_expertise * 0.6) + 
                       (evidence_quality * 0.3) + 
                       (consensus_building * 0.1)

# Performance Monitoring
performance_monitoring:
  consultation_effectiveness:
    decision_quality_score: target_90_percent
    implementation_success_rate: target_85_percent
    stakeholder_satisfaction: target_90_percent
    
  agent_coordination:
    handoff_success_rate: target_95_percent
    context_preservation: target_90_percent
    quality_consistency: target_85_percent
    
  behavioral_compliance:
    anti_pattern_violations: target_zero
    evidence_utilization: target_90_percent
    structured_thinking: target_100_percent

# Success Patterns
success_patterns:
  high_quality_consultations:
    characteristics:
      - "Independent analysis before group discussion"
      - "Evidence-backed recommendations"
      - "Clear documentation of decisions"
      - "Structured handoffs between phases"
    
    behavioral_markers:
      - "No vague language in final recommendations"
      - "Multiple perspectives genuinely considered"
      - "Quality standards maintained throughout"
      - "Context preserved across agent interactions"
    
    replication_guidelines:
      - "Always start with individual analysis"
      - "Require evidence for all claims"
      - "Document decision rationale clearly"
      - "Validate quality at each handoff"

  effective_conflict_resolution:
    characteristics:
      - "Evidence trumps opinion"
      - "Domain expertise respected"
      - "Clear decision criteria established"
      - "Rationale documented for future reference"
    
    behavioral_markers:
      - "Objective criteria used for decisions"
      - "No personal attacks or emotional arguments"
      - "Learning from disagreement"
      - "Stronger team cohesion after resolution"